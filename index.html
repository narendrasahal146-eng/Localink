let data=JSON.parse(localStorage.getItem('kakeiboData')||'null')||structuredClone(seed);let page='overview',query='',editId=null;const $=s=>document.querySelector(s);const app=$('#app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'No date';const save=()=>localStorage.setItem('kakeiboData',JSON.stringify(data));const totalOpen=()=>data.experiments.filter(x=>!['Analyzed'].includes(x.status)).length;function toast(msg){$('#toastRoot').innerHTML=`<div class="toast">✓ &nbsp;${esc(msg)}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',2800)}function navTo(p){page=p;$('#crumbName').textContent=p==='overview'?'Overview':config[p]?.label||'Settings';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#sidebar').classList.remove('open');render()}$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)navTo(b.dataset.page)});$('#mobileMenu').onclick=()=>$('#sidebar').classList.toggle('open');$('#globalSearch').addEventListener('input',e=>{query=e.target.value;render()});$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kakeibo-workspace-export.json';a.click();URL.revokeObjectURL(a.href);toast('Workspace data exported')};
function pageIntro(title,desc,btn){return `<div class="page-intro"><div><div class="eyebrow">Kakeibo workspace</div><h1>${title}</h1><p>${desc}</p></div>${btn?`<button class="btn btn-primary" onclick="openForm('${page}')">＋ ${btn}</button>`:''}</div>`}function stat(label,num,note,icon){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-num">${num}</div><div class="stat-note">${note}</div></div>`}function statusTag(s){let cl=/review|draft|discovery|needs|validate|synthesis/i.test(s)?'orange':/running|progress|ready/i.test(s)?'blue':/approved|published|validated|complete|done|recorded|analyzed/i.test(s)?'':'gray';return `<span class="tag ${cl}">${esc(s||'Unassigned')}</span>`}function matches(o){return !query||Object.values(o).some(v=>String(v??'').toLowerCase().includes(query.toLowerCase()))}function render(){if(page==='overview')renderOverview();else if(page==='settings')renderSettings();else renderModule(page)}
function renderOverview(){const activeResearch=data.research.filter(x=>!['Validated','Archived'].includes(x.status)).length,interviews=data.interviews.length,content=data.content.filter(x=>!['Published'].includes(x.status)).length;app.innerHTML=`<div class="welcome"><div><div class="eyebrow">Tuesday, ${new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</div><h1>Good work starts with <span style="color:var(--terra)">good questions.</span></h1><p>Your research-to-product workspace. Keep learning, capture what matters, and turn insight into action.</p></div><button class="btn btn-primary" onclick="openForm('research')">＋ Add research</button></div><div class="stats">${stat('Active research',activeResearch,'<span>↗</span> Questions in motion','⌕')}${stat('Interview records',interviews,'Demo / anonymized records','◉')}${stat('Content in progress',content,'Across your content pipeline','▤')}${stat('Open hypotheses',totalOpen(),'Waiting to be tested','◈')}</div><div class="grid-2"><div class="panel"><div class="panel-head"><h2>Team activity</h2><span class="tag">Last 7 days</span></div><div class="activity-chart">${[['M',38,54],['T',65,35],['W',47,72],['T',79,53],['F',53,86],['S',29,46],['S',43,64]].map(([d,a,b])=>`<div class="bar-col"><div class="bars"><div class="bar" style="height:${a}%"></div><div class="bar alt" style="height:${b}%"></div></div><span class="day">${d}</span></div>`).join('')}</div><div class="legend"><span><i class="dot" style="background:#b5cdb7"></i>Research updates</span><span><i class="dot" style="background:var(--green)"></i>Content & experiments</span><span style="margin-left:auto">Illustrative activity</span></div></div><div class="panel"><div class="panel-head"><h2>Research → action pipeline</h2><span class="muted small">Current workspace</span></div><div class="pipeline">${[['Research captured',data.research.length],['Interviews logged',data.interviews.length],['Hypotheses drafted',data.experiments.length],['Content pieces',data.content.length]].map(([n,v])=>`<div class="pipe-row"><span>${n}</span><div class="pipe-track"><div class="pipe-fill" style="width:${Math.min(100,Number(v)*14+15)}%"></div></div><b>${v}</b></div>`).join('')}</div><div class="callout">🌿 <strong>Research principle</strong><br>Label what you know, what you suspect, and what you still need to test.</div></div></div><div class="grid-2"><div class="panel"><div class="panel-head"><h2>Recent workspace items</h2><button class="btn btn-soft" onclick="navTo('research')">View library ↗</button></div><div class="list">${[...data.research.map(x=>({...x,kind:'Research',target:'research',symbol:'⌕'})),...data.content.map(x=>({...x,kind:'Content',target:'content',symbol:'▤'})),...data.experiments.map(x=>({...x,kind:'Experiment',target:'experiments',symbol:'◈'}))].filter(matches).sort((a,b)=>Number(b.id)-Number(a.id)).slice(0,5).map(x=>`<div class="activity-item"><div class="activity-symbol">${x.symbol}</div><div style="min-width:0;flex:1"><strong>${esc(x.title)}</strong><p>${esc(x.kind)} · ${esc(x.owner||'Team')}</p></div>${statusTag(x.status||'Draft')}</div>`).join('')||'<div class="empty">No matching items.</div>'}</div></div><div class="panel"><div class="panel-head"><h2>Upcoming content</h2><button class="btn btn-soft" onclick="navTo('content')">Open studio ↗</button></div>${data.content.filter(x=>x.status!=='Published').sort((a,b)=>(a.due||'').localeCompare(b.due||'')).slice(0,4).map(x=>{const d=x.due?new Date(x.due+'T12:00:00'):null;return `<div class="deadline"><div class="date-box"><div><b>${d?d.getDate():'—'}</b><span>${d?d.toLocaleDateString('en-IN',{month:'short'}):'TBD'}</span></div></div><div style="flex:1"><strong>${esc(x.title)}</strong><p>${esc(x.channel)} · ${esc(x.status)}</p></div></div>`}).join('')||'<p class="muted">No upcoming content.</p>'}</div></div><div class="callout"><strong>Prototype workspace:</strong> all starter records are illustrative demo data. Validate research and competitor details before using them in product or marketing decisions. Changes are saved in this browser only.</div>`}
function renderModule(key){const c=config[key];let items=data[key].filter(matches);app.innerHTML=pageIntro(c.label,c.desc,c.add)+`<div class="section-toolbar"><input class="search" id="moduleSearch" placeholder="Search ${c.label.toLowerCase()}…" value="${esc(query)}"><select class="filter" id="statusFilter"><option value="">All statuses</option>${[...new Set(data[key].map(x=>x.status||x.stage||x.review).filter(Boolean))].map(s=>`<option>${esc(s)}</option>`).join('')}</select><span class="muted small">${items.length} record${items.length===1?'':'s'}</span></div><div id="records">${c.kind==='table'?renderTable(key,items):renderCards(key,items)}</div><div class="callout">${key==='competitors'?'⚠ Competitor data is illustrative. Verify current product features, availability, and pricing against primary sources before relying on it.':key==='interviews'?'🔒 Use participant pseudonyms only. Record consent status, avoid unnecessary personal data, and store real interview notes in an access-controlled system.':'🌱 Starter entries are illustrative demo data. Replace with validated evidence and link source material before making decisions.'}</div>`;$('#moduleSearch').oninput=e=>{query=e.target.value;const filtered=data[key].filter(matches);$('#records').innerHTML=c.kind==='table'?renderTable(key,filtered):renderCards(key,filtered)};$('#statusFilter').onchange=e=>{const base=data[key].filter(matches),v=e.target.value,filtered=v?base.filter(x=>(x.status||x.stage||x.review)===v):base;$('#records').innerHTML=c.kind==='table'?renderTable(key,filtered):renderCards(key,filtered)}}
function renderCards(key,items){if(!items.length)return '<div class="empty"><b>No records found</b>Try changing your search or create a new record.</div>';return `<div class="record-grid">${items.map(x=>`<article class="record-card"><div class="record-top"><span class="tag">${esc(x.type||x.channel||x.priority||x.topic||'Workspace')}</span>${statusTag(x.status||x.stage||x.review||'Open')}</div><h3>${esc(x.title)}</h3><p>${esc(x.summary||x.hypothesis||x.decision||x.problem||x.position||'Add a summary to make this record useful to the team.')}</p><div class="record-foot"><span>${esc(x.owner||x.segment||x.audience||x.date||'Team record')}</span><div class="record-actions"><button class="mini-btn" onclick="openForm('${key}',${x.id})">Edit</button><button class="mini-btn" onclick="deleteRecord('${key}',${x.id})" aria-label="Delete ${esc(x.title)}">×</button></div></div></article>`).join('')}</div>`}
function renderTable(key,items){const columns={interviews:[['title','Interview'],['segment','Segment'],['date','Date'],['stage','Stage'],['consent','Consent']],competitors:[['title','Product / alternative'],['category','Category'],['position','Positioning'],['review','Review status']],backlog:[['title','Opportunity'],['impact','Impact'],['effort','Effort'],['priority','Priority'],['status','Status'],['owner','Owner']]};if(!items.length)return '<div class="empty"><b>No records found</b>Try changing your search or create a new record.</div>';return `<div class="table-wrap"><table class="data-table"><thead><tr>${columns[key].map(c=>`<th>${c[1]}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${items.map(x=>`<tr>${columns[key].map(([f])=>`<td>${f==='status'||f==='stage'||f==='review'||f==='consent'?statusTag(x[f]):`<strong>${esc(x[f]||'—')}</strong>${f==='title'&&x.summary?`<span class="table-sub">${esc(x.summary.slice(0,80))}</span>`:''}`}</td>`).join('')}<td><button class="mini-btn" onclick="openForm('${key}',${x.id})">Edit</button> <button class="mini-btn" onclick="deleteRecord('${key}',${x.id})">Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function openForm(key,id=null){const c=config[key];editId=id;const item=id?data[key].find(x=>x.id===id)||{}:{};$('#modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeForm()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle"><div class="modal-head"><div><div class="eyebrow">${id?'Update record':'Create record'}</div><h2 id="formTitle">${id?'Edit':'New'} ${c.label.replace(/s$/,'')}</h2></div><button class="icon-btn" onclick="closeForm()" aria-label="Close dialog">×</button></div><form id="recordForm"><div class="modal-body"><div class="form-grid">${c.fields.map(([f,label,type,required])=>{let input;if(type.startsWith('select:'))input=`<select id="f_${f}" name="${f}" ${required?'required':''}><option value="">Choose…</option>${type.slice(7).split(',').map(v=>`<option ${item[f]===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`;else if(type==='textarea')input=`<textarea id="f_${f}" name="${f}" ${required?'required':''} placeholder="Add clear, useful detail…">${esc(item[f]||'')}</textarea>`;else input=`<input id="f_${f}" name="${f}" type="${type}" value="${esc(item[f]||'')}" ${required?'required':''} placeholder="${type==='url'?'https://…':`Enter ${label.toLowerCase()}`}" ${type==='url'?'pattern="https?://.+"':''}>`;return `<div class="field ${type==='textarea'?'full':''}"><label for="f_${f}">${label}${required?' *':''}</label>${input}</div>`}).join('')}</div></div><div class="modal-foot"><span class="muted small">* Required field</span><div class="right"><button type="button" class="btn btn-plain" onclick="closeForm()">Cancel</button><button class="btn btn-primary" type="submit">${id?'Save changes':'Create record'}</button></div></div></form></div></div>`;$('#recordForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),obj={};for(const [k,v] of fd.entries())obj[k]=v;obj.id=id||Date.now();if(id){obj.demo=false;data[key]=data[key].map(x=>x.id===id?{...x,...obj}:x)}else{obj.demo=false;data[key].unshift(obj)}save();closeForm();render();toast(id?'Record updated':'Record created')};setTimeout(()=>$('#modalRoot input,#modalRoot select,#modalRoot textarea')?.focus(),50)}function closeForm(){$('#modalRoot').innerHTML='';editId=null}function deleteRecord(key,id){const item=data[key].find(x=>x.id===id);if(!confirm(`Delete “${item?.title||'this record'}”? This cannot be undone.`))return;data[key]=data[key].filter(x=>x.id!==id);save();render();toast('Record deleted')}
function renderSettings(){app.innerHTML=pageIntro('Settings','Workspace preferences, data portability, and prototype guardrails.')+`<div class="settings-grid"><div class="settings-card"><div class="eyebrow">Workspace</div><h2>Kakeibo research team</h2><p>India-first money-management product inspired by the Japanese Kakeibo practice. This workspace helps organize discovery, content, and product learning.</p><div class="field" style="max-width:300px;margin:16px 0"><label>Default currency</label><select disabled><option>INR — Indian Rupee (₹)</option></select></div><div class="field" style="max-width:300px"><label>Workspace timezone</label><select disabled><option>Asia/Kolkata (IST)</option></select></div></div><div class="settings-card"><div class="eyebrow">Data portability</div><h2>Your data stays in this browser</h2><p>Current prototype stores changes in localStorage. It is not shared with teammates or synchronized to a central database. Export a JSON backup before switching devices or clearing browser data.</p><button class="btn btn-primary" onclick="$('#exportBtn').click()">↥ Export workspace JSON</button><button class="btn btn-plain" onclick="resetDemo()" style="margin-left:6px">Reset demo data</button></div><div class="settings-card"><div class="eyebrow">Next-stage checklist</div><h2>Before team-wide use</h2><p>☐ Connect a shared database (e.g. Supabase)<br>☐ Add authentication and role-based access<br>☐ Add row-level security and audit logs<br>☐ Define retention and consent practices for interview data<br>☐ Connect GitHub for version control and review<br>☐ Add automated tests and production monitoring</p></div><div class="settings-card"><div class="eyebrow">Research integrity</div><h2>Demo data ≠ evidence</h2><p>All initial records are illustrative. Competitor pricing/features and market statements require verification. Keep source URLs, dates, confidence, and validation status with findings. Never store bank credentials or unnecessary sensitive personal data here.</p><span class="tiny-pill">INTERNAL PROTOTYPE</span></div></div>`}function resetDemo(){if(!confirm('Reset all local workspace changes and restore the original demo records?'))return;data=structuredClone(seed);save();query='';$('#globalSearch').value='';render();toast('Demo workspace restored')}
